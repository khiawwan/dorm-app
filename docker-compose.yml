services:
  dorm-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - dorm-data:/app/data
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/dorm.db
      # เปลี่ยนค่าเหล่านี้ก่อน deploy ขึ้นสาธารณะ (ดูหัวข้อ "การเข้าสู่ระบบ" ใน README)
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=saharut@kw
      - AUTH_SECRET=change-me-to-a-long-random-string

volumes:
  dorm-data:
